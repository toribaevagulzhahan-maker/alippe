{word:'су',pic:'💧',parts:['Мен','су','іштім.']},
{word:'мектеп',pic:'🏫',parts:['Мен','мектепке','барамын.']},
{word:'кітап',pic:'📚',parts:['Атам','кітап','оқыды.']},
{word:'дос',pic:'🤝',parts:['Бұл','менің','досым.']},
{word:'күн',pic:'☀️',parts:['Бүгін','күн','ашық.']},
{word:'гүл',pic:'🌷',parts:['Бақта','гүл','өсті.']},
{word:'алма',pic:'🍎',parts:['Анам','алма','әкелді.']}
]};
const STORE_KEY='smart_alippe_version_1';
function defaultData(){return {current:'О-01',profiles:Object.fromEntries(Array.from({length:25},(_,i)=>['О-'+String(i+1).padStart(2,'0'),{modules:{},diagnostic:{before:'',after:''}}]))};}
function loadData(){try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(d&&d.profiles&&typeof d.profiles==='object'){const init=defaultData();for(const key of Object.keys(init.profiles)){if(d.profiles[key]){init.profiles[key].modules=d.profiles[key].modules||{};init.profiles[key].diagnostic=d.profiles[key].diagnostic||{before:'',after:''};}}if(init.profiles[d.current])init.current=d.current;return init;}}catch(e){}return defaultData();}
let data=loadData();let ui={page:'home',module:null,index:0,selected:null,stage:[],feedback:null,secondTry:false,points:0,answers:[],reveal:false,assist:false};
function saveData(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){/* storage disabled; app works during current session */}}
function active(){return data.profiles[data.current]};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function classNum(n){return String(n).padStart(2,'0');}
function moduleInfo(id){return MODULES.find(x=>x.id===id)}
function profileSelect(){const s=$('#profile');s.innerHTML=Object.keys(data.profiles).map(k=>`<option value="${k}" ${data.current===k?'selected':''}>${k} • оқушы</option>`).join('');}
function setPage(name){ui.page=name;ui.feedback=null;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){profileSelect();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('is-current',b.dataset.nav===(ui.page==='game'||ui.page==='finish'?'modules':ui.page)));
if(ui.page==='home')app.innerHTML=renderHome();else if(ui.page==='modules')app.innerHTML=renderModules();else if(ui.page==='game')app.innerHTML=renderGame();else if(ui.page==='finish')app.innerHTML=renderFinish();else if(ui.page==='progress')app.innerHTML=renderProgress();else app.innerHTML=renderTeacher();}
function renderHero(){return `<section class="hero"><div class="hero-text"><span class="eyebrow">✦ БАСТАУЫШ СЫНЫПҚА АРНАЛҒАН ОЙЫН ЗЕРТХАНАСЫ</span><h1>Әріптер <em>сөйлейді!</em></h1><p>Дыбысты естиміз, әріпті танимыз, буын мен сөз құрастырамыз. Білімді қызықты ойын арқылы бірге меңгерейік!</p><div class="actions"><button class="btn btn-main" data-action="start" data-module="listen">▶ Ойынды бастау</button><button class="btn btn-white" data-action="modules">🧩 Барлық ойындар</button></div></div><div class="hero-art" aria-hidden="true"><div class="art-circle"><span class="art-main">Ә</span></div><span class="letter-bubble bubble-a">А</span><span class="letter-bubble bubble-b">Б</span><span class="letter-bubble bubble-c">Н</span><span class="letter-bubble bubble-d">М</span><span class="sparkle sparkle-one">✨</span><span class="sparkle sparkle-two">⭐</span></div></section>`}
function renderModuleCards(){return `<div class="module-grid">${MODULES.map((m,i)=>{let d=active().modules[m.id];return `<article class="module" style="--mcolor:${m.color};--msoft:${m.soft}"><div class="module-inner"><div class="mod-icon">${m.icon}</div><h3>${i+1}. ${m.name}</h3><p>${m.desc}</p><div class="module-bottom"><button class="mod-cta" data-action="start" data-module="${m.id}" aria-label="${m.name} ойынын бастау">${d?'Қайта ойнау →':'Бастау →'}</button><span class="mod-status ${d?'done':''}">${d?'★ '+d.best+'/'+d.total:'Жаңа ойын'}</span></div></div></article>`}).join('')}</div>`}
function renderHome(){const passed=MODULES.filter(m=>active().modules[m.id]).length;return `${renderHero()}<div class="topline"><div><h2>Алты қызықты бөлім 🎈</h2><p>Әр ойында тыңдаймыз, ойланамыз және әрекет жасаймыз.</p></div><span class="pill">${esc(data.current)} · ${passed}/6 бөлім аяқталған</span></div>${renderModuleCards()}<div class="path"><div><h3>🌈 Сауат ашудың бес қадамы</h3><p>Ойындар бірізді оқу әрекетіне негізделген.</p></div><div class="path-steps"><span class="step">ЕСТІ</span><span class="step">АЖЫРАТ</span><span class="step">ТАНЫ</span><span class="step">ҚҰРА</span><span class="step">ҚОЛДАН</span></div></div>`}
function renderModules(){return `<div class="section-head"><span class="eyebrow">🧩 ОЙЫНДАР ЖИНАҒЫ</span><h2 style="margin-top:18px">Өзіңе ұнаған ойынды таңда!</h2><p>Бөлімдердің барлығы ашық. Дұрыс жауап беруге асықпа — ойланып орында.</p></div>${renderModuleCards()}<div class="path"><div><h3>🔊 Дыбысты тыңдау туралы</h3><p>Дыбыстау құрылғыңыздағы қазақша сөйлеу мүмкіндігіне тәуелді. Қажет болса, мұғалім сөзді дауыстап оқиды.</p></div><button class="btn btn-white" data-action="teacher">Мұғалімге кеңес →</button></div>`}
function startGame(id){if(!BANK[id])return;ui={page:'game',module:id,index:0,selected:null,stage:[],feedback:null,secondTry:false,points:0,answers:[],reveal:false,assist:false};render();window.scrollTo({top:0,behavior:'instant'});}
function getCurrent(){return BANK[ui.module][ui.index]}
function soundText(q){return q.word}
function makeTiles(q){let vals;if(ui.module==='syllable')vals=q.parts.concat(q.extra);else if(ui.module==='word')vals=Array.from(q.word).concat(q.extra);else vals=q.parts.slice();let decorated=vals.map((value,idx)=>({value,idx}));if(ui.module==='sentence')decorated=[...decorated].reverse();else{decorated.sort((a,b)=>((a.idx*7+ui.index*3)%11)-((b.idx*7+ui.index*3)%11));if(decorated.map(x=>x.value).join('')===q.word){decorated.reverse();}}
return decorated;}
function currentTokens(){return makeTiles(getCurrent());}
function renderGame(){const m=moduleInfo(ui.module),questions=BANK[ui.module],q=getCurrent();if(!q)return '';let pct=Math.round(ui.index/questions.length*100);return `<div class="game-wrap"><div class="game-top"><button class="back" data-action="modules">← Ойындарға оралу</button><div class="game-label"><div class="game-label-emoji" style="background:${m.soft}">${m.icon}</div><div><strong>${m.name}</strong><span>${esc(data.current)} · ${ui.points} жұлдызша</span></div></div></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${ui.index}" aria-label="Ойын барысы"><div class="progress-fill" style="width:${pct}%"></div></div><section class="quiz-card"><div class="quiz-head"><span class="quiz-count">${ui.index+1} / ${questions.length} тапсырма</span><span class="quiz-tag">✦ Дыбыстан — сөзге</span></div>${renderQuestion(q)}${ui.feedback?`<div class="msg ${ui.feedback==='correct'?'good':'try'}" role="status">${ui.feedback==='correct'?'🌟 Керемет! Дұрыс орындадың!':'💡 Тағы бір рет байқап көр. Сенің қолыңнан келеді!'}</div>`:''}<div class="quiz-actions">${ui.feedback==='correct'?`<button class="btn btn-main" data-action="next">${ui.index+1>=questions.length?'🏆 Нәтижені көру':'Келесі тапсырма →'}</button>`:''}${(ui.module==='syllable'||ui.module==='word'||ui.module==='sentence')&&!ui.feedback||ui.feedback==='wrong'&&['syllable','word','sentence'].includes(ui.module)?`<button class="btn btn-white" data-action="clear">↺ Қайта бастау</button>`:''}</div></section><div class="helper-commands">Ойлануға уақыт жеткілікті. Қате жауап үшін ойын тоқтамайды. 🌼</div></div>`}
function renderQuestion(q){const id=ui.module;const disabled=ui.feedback==='correct'?'disabled':'';
if(id==='listen'){return `<h2>Сөзді тыңда да, бірінші дыбысын таңда!</h2><div class="big-emoji" aria-hidden="true">${q.pic}</div><button class="sound-button" data-action="speak">🔊 Сөзді тыңдау</button>${ui.reveal?`<div class="target-note">Сөз: <strong>${esc(q.word)}</strong></div>`:''}<div class="choices">${q.choices.map(v=>`<button class="choice ${choiceClass(v,q.ans)}" data-action="answer" data-value="${esc(v)}" ${disabled}>${esc(v.toUpperCase())}</button>`).join('')}</div><button class="subtle-link" data-action="reveal">${ui.reveal?'Сөзді жасыру':'Дыбыс естілмесе, сөзді көрсету'}</button><p class="audio-info">Дыбыстау браузерге байланысты. Қазақша дыбыс дұрыс шықпаса, сөзді мұғалім оқып береді.</p>`}
if(id==='position'){const a=['Басында','Ортасында','Соңында','Басында және соңында'];return `<h2>«${esc(q.sound.toUpperCase())}» дыбысы сөздің қай жерінде?</h2><div class="big-emoji" aria-hidden="true">${q.pic}</div><div class="target-note"><span class="word-sample">${esc(q.word)}</span></div><button class="sound-button" data-action="speak">🔊 Сөзді тыңдау</button><div class="choices choice-grid-4">${a.map(v=>`<button class="choice long ${choiceClass(v,q.ans)}" data-action="answer" data-value="${esc(v)}" ${disabled}>${esc(v)}</button>`).join('')}</div><p class="audio-info">Бір дыбыс сөз ішінде бірнеше рет кездесе алады.</p>`}
if(id==='match'){return `<h2>Бұл сөз қай әріптен басталады?</h2><div class="big-emoji" aria-hidden="true">${q.pic}</div><div class="target-note"><span class="word-sample">${esc(q.word)}</span></div><div class="choices">${q.choices.map(v=>`<button class="choice ${choiceClass(v,q.ans)}" data-action="answer" data-value="${esc(v)}" ${disabled}>${esc(v)}</button>`).join('')}</div>`}
if(id==='syllable'||id==='word'||id==='sentence'){const sentence=id==='sentence';const vals=currentTokens();let intro=sentence?'Суретке сай дұрыс сөйлем құрастыр!':id==='word'?'Суретке қарап, әріптерден сөз құрастыр!':'Буындарды біріктіріп, сөз құрастыр!';let target=id==='syllable'||id==='sentence'?`<span class="word-sample">${esc(q.word)}</span>`:'';return `<h2>${intro}</h2><div class="big-emoji" aria-hidden="true">${q.pic}</div><div class="target-note">${target}${sentence?'<p style="font-size:13px;margin:8px 0 0">Сөздерді дұрыс ретімен орналастыр.</p>':''}</div><div class="stage-box" aria-live="polite">${ui.stage.length?ui.stage.map((i,pos)=>{let t=vals.find(x=>x.idx===i);return `<button class="tile stage ${sentence?'smalltile':''}" data-action="remove" data-pos="${pos}" ${disabled} aria-label="${esc(t.value)} бөлшегін алу">${esc(t.value)}</button>`}).join(''):`<span class="stage-blank">${sentence?'Сөйлем осында құралады':'Жауабың осында пайда болады'} ✨</span>`}</div><div class="tiles">${vals.map(t=>`<button class="tile ${sentence?'smalltile':''} ${ui.stage.includes(t.idx)?'used':''}" data-action="tile" data-idx="${t.idx}" ${ui.stage.includes(t.idx)||disabled?'disabled':''}>${esc(t.value)}</button>`).join('')}</div><div class="quiz-actions"><button class="btn btn-teal" data-action="check" ${ui.feedback==='correct'||!ui.stage.length?'disabled':''}>✓ Тексеру</button>${sentence?`<button class="btn btn-soft" data-action="speak">🔊 Суреттегі сөз</button>`:''}</div>`}
return ''}
function choiceClass(value,answer){if(ui.feedback==='correct'&&value===answer)return 'is-correct';if(ui.feedback==='wrong'&&ui.selected===value)return 'is-wrong';return ''}
function success(){ui.feedback='correct';ui.answers.push(!ui.secondTry);if(!ui.secondTry)ui.points++;render();tone(true)}
function fail(){ui.feedback='wrong';ui.secondTry=true;render();tone(false)}
function answer(v){if(ui.feedback==='correct')return;const q=getCurrent();ui.selected=v;if(v===q.ans)success();else fail()}
function stageClick(idx){if(ui.feedback==='correct')return;idx=Number(idx);if(ui.stage.includes(idx))return;ui.stage.push(idx);ui.feedback=null;render()}
function stageRemove(pos){if(ui.feedback==='correct')return;ui.stage.splice(Number(pos),1);ui.feedback=null;render()}
function stageCheck(){if(ui.feedback==='correct')return;const q=getCurrent(),vals=currentTokens();const joined=ui.stage.map(i=>vals.find(t=>t.idx===i)?.value).join(ui.module==='sentence'?' ':'');const target=ui.module==='sentence'?q.parts.join(' '):q.word;if(joined===target)success();else fail();}
function next(){if(ui.feedback!=='correct')return;if(ui.index+1>=BANK[ui.module].length){const record=active().modules[ui.module]||{best:0,plays:0,total:BANK[ui.module].length};record.best=Math.max(record.best,ui.points);record.last=ui.points;record.plays=(record.plays||0)+1;record.total=BANK[ui.module].length;record.lastAt=new Date().toISOString().slice(0,10);active().modules[ui.module]=record;saveData();ui.page='finish';render();window.scrollTo({top:0,behavior:'instant'});return;}ui.index++;ui.stage=[];ui.feedback=null;ui.selected=null;ui.secondTry=false;ui.reveal=false;render();window.scrollTo({top:0,behavior:'instant'});}
function renderFinish(){const m=moduleInfo(ui.module),total=BANK[ui.module].length,ratio=Math.round(ui.points/total*100);const phrase=ratio>=90?'Тамаша! Сен нағыз әріп шеберісің!':ratio>=60?'Жақсы жұмыс! Тағы жаттықсаң, тіпті керемет болады!':'Жарайсың! Ойнап, үйренуді жалғастыр!';return `<section class="results-card"><div class="results-icon res-spark">${ratio>=90?'🏆':ratio>=60?'🌟':'🌈'}</div><h1>Ойын аяқталды!</h1><p>${m.name} бөлімін орындадың.</p><div class="score-big">${ui.points} / ${total} ⭐</div><h3>${phrase}</h3><p>Жұлдызша алғашқы мүмкіндікте дұрыс орындалған тапсырма үшін беріледі. Қате жауап болса да, қайта орындауға болады.</p><div class="stat-row"><div class="stat"><strong>${ratio}%</strong><span>Алғашқы жауаптар</span></div><div class="stat"><strong>${total}</strong><span>Тапсырма</span></div><div class="stat"><strong>${Object.keys(active().modules).length}/6</strong><span>Аяқталған бөлім</span></div></div><div class="actions" style="justify-content:center"><button class="btn btn-main" data-action="start" data-module="${m.id}">↻ Қайта ойнау</button><button class="btn btn-white" data-action="modules">🧩 Басқа ойындар</button><button class="btn btn-soft" data-action="progress">📊 Жетістігім</button></div></section>`}
function renderProgress(){const profile=active(),played=MODULES.filter(m=>profile.modules[m.id]),sum=played.reduce((n,m)=>n+profile.modules[m.id].best,0),max=played.reduce((n,m)=>n+profile.modules[m.id].total,0);return `<div class="section-head"><span class="eyebrow">🏅 МЕНІҢ ЖЕТІСТІГІМ</span><h2 style="margin-top:18px">Кішкентай қадам — үлкен жетістік!</h2><p>${esc(data.current)} оқушысының осы браузердегі ойын нәтижелері.</p></div><div class="dashboard-top"><div class="stat"><strong>${played.length}/6</strong><span>Аяқталған ойын</span></div><div class="stat"><strong>${sum} ⭐</strong><span>Ең жақсы жұлдызша</span></div><div class="stat"><strong>${max?Math.round(sum/max*100):0}%</strong><span>Үздік нәтижелер үлесі</span></div></div><section class="section-card"><h3>Бөлімдер бойынша ілгерілеу</h3><div class="modules-summary">${MODULES.map(m=>{const r=profile.modules[m.id];const pct=r?Math.round(r.best/r.total*100):0;return `<div class="summary-item"><h4>${m.icon} ${m.name}</h4><p>${r?`Ең жоғары балл: ${r.best}/${r.total}. Ойнағаны: ${r.plays} рет.`:'Әзірге ойын ойналмаған.'}</p><div class="mini-progress" aria-label="${pct}%"><span style="width:${pct}%"></span></div></div>`}).join('')}</div></section><section class="section-card"><h3>🌷 Мадақтама</h3><p>${played.length===6?'Сен барлық бөлімді орындадың! Жарайсың!':`Тағы ${6-played.length} бөлімді орындасаң, алты бөлімнің бәрін аяқтайсың.`}</p><button class="btn btn-main" data-action="modules">Ойындарды жалғастыру →</button></section>`}
function allStats(){const arr=Object.entries(data.profiles),paired=arr.map(([code,p])=>({code,b:Number(p.diagnostic.before),a:Number(p.diagnostic.after),has:p.diagnostic.before!==''&&p.diagnostic.after!==''})).filter(x=>x.has);const mean=k=>paired.length?paired.reduce((s,x)=>s+x[k],0)/paired.length:null;const activeProfiles=arr.filter(([,p])=>Object.keys(p.modules).length>0).length;return{paired,meanBefore:mean('b'),meanAfter:mean('a'),activeProfiles}}
function renderTeacher(){const s=allStats();const f=n=>n===null?'—':n.toFixed(1).replace('.',',');return `<div class="section-head"><span class="eyebrow">👩‍🏫 МҰҒАЛІМ ПАНЕЛІ</span><h2 style="margin-top:18px">Оқушы ілгерілеуін бақылау</h2><p>25 анонимді оқушы коды. Нәтижелер тек осы браузердің жергілікті жадында сақталады.</p></div><div class="dashboard-top"><div class="stat"><strong>${s.activeProfiles}/25</strong><span>Ойын бастаған оқушы</span></div><div class="stat"><strong>${s.paired.length}/25</strong><span>Екі диагностикасы бар</span></div><div class="stat"><strong>${s.paired.length?f(s.meanAfter-s.meanBefore):'—'}</strong><span>Орташа өсім, балл</span></div></div><section class="section-card"><h3>Оқыту моделі</h3><div class="teacher-flow"><span>👂 ЕСТІ</span><span>🔎 АЖЫРАТ</span><span>🔠 ТАНЫ</span><span>🧩 ҚҰРА</span><span>💬 ҚОЛДАН</span></div><p>Алты интерактивті модуль осы бес оқу әрекетін толықтырады. Ойындар қалыптастырушы бағалауға көмектеседі, ал зерттеу диагностикасы бөлек жүргізіледі.</p><div class="teach-callout">🔊 «Дыбысты тыңда» бөлімінде сөзді дыбыстау браузердегі қазақша дауысқа тәуелді. Дауыс сапасы сәйкес келмесе, сөзді мұғалім айтады, оқушы жауап таңдайды. Интернетке тәуелді сыртқы сервис қолданылмайды, бірақ кей құрылғыда сөйлеу функциясы қолжетімсіз болуы мүмкін.</div></section><section class="section-card"><h3>Бастапқы және қорытынды диагностика (0–10 балл)</h3><p>Әр оқушыға бес көрсеткіш бойынша екі тапсырмадан беріп, әр дұрыс жауапқа 1 балл қойыңыз. Бірдей бағалау критерийлерін екі кезеңде де пайдаланыңыз.</p><div class="table-scroller"><table><thead><tr><th>Оқушы</th><th>Бастапқы /10</th><th>Қорытынды /10</th><th>Өсім</th><th>Аяқталған ойын</th><th>Үздік ұпайлар</th></tr></thead><tbody>${Object.entries(data.profiles).map(([code,p])=>{const b=p.diagnostic.before,a=p.diagnostic.after,valid=b!==''&&a!=='';const mods=Object.values(p.modules);return `<tr><td><strong>${code}</strong></td><td>${scoreSelect(code,'before',b)}</td><td>${scoreSelect(code,'after',a)}</td><td><strong>${valid?`${Number(a)-Number(b)>0?'+':''}${Number(a)-Number(b)}`:'—'}</strong></td><td>${mods.length}/6</td><td>${mods.reduce((sum,r)=>sum+(r.best||0),0)} ⭐</td></tr>`}).join('')}</tbody></table></div><div class="teach-callout">📋 Толық нәтижесі бар оқушылар: <strong>${s.paired.length}</strong>. Бастапқы орташа: <strong>${f(s.meanBefore)}</strong>. Қорытынды орташа: <strong>${f(s.meanAfter)}</strong>. ${s.paired.length===0?'Кесте бос тұр: нақты зерттеу деректерін енгізгенде ғана есептеледі.':''}</div><div class="actions"><button class="btn btn-main" data-action="export">⬇ CSV есепті алу</button><button class="btn btn-white" data-action="clear-data">🧹 Барлық деректі тазарту</button></div></section><section class="section-card"><h3>Бағалау өлшемдері</h3><div class="table-scroller"><table><thead><tr><th>№</th><th>Көрсеткіш</th><th>Ең жоғары балл</th></tr></thead><tbody>${['Берілген дыбысты сөз ішінен анықтау','Дыбысты әріппен сәйкестендіру','Дыбыстың сөздегі орнын табу','Буын және сөз құрастыру','Қарапайым сөздерді дұрыс оқу'].map((s,i)=>`<tr><td>${i+1}</td><td>${s}</td><td>2</td></tr>`).join('')}</tbody></table></div><div class="teacher-note">Зерттеуге қатысты маңызды ескерту: бұл құрал педагогикалық жұмыс пен нәтижелерді тіркеуге арналған. Диагностика жүргізілмей тұрып жақсарған көрсеткіштер ойдан берілмейді. Бір сыныптың бастапқы және қорытынды нәтижелері ғана әдістің себептік тиімділігін түпкілікті дәлелдемейді.</div></section>`}
function scoreSelect(code,part,value){return `<select class="form-select" data-diagnostic="${part}" data-code="${code}" aria-label="${code} ${part==='before'?'бастапқы':'қорытынды'} диагностика"><option value="">—</option>${Array.from({length:11},(_,i)=>`<option value="${i}" ${String(value)===String(i)?'selected':''}>${i}</option>`).join('')}</select>`}
function exportCSV(){const header=['Оқушы коды','Бастапқы балл /10','Қорытынды балл /10','Өсім','Аяқталған ойындар','Жұлдызшалар','Ойналған әрекеттер'];const rows=Object.entries(data.profiles).map(([id,p])=>{const d=p.diagnostic,mods=Object.values(p.modules),valid=d.before!==''&&d.after!=='';return[id,d.before,d.after,valid?Number(d.after)-Number(d.before):'',mods.length,mods.reduce((s,m)=>s+(m.best||0),0),mods.reduce((s,m)=>s+(m.plays||0),0)]});const csv='\ufeff'+[header,...rows].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SMART_ALIPPE_25_оқушы_есебі.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function speak(word){if(!('speechSynthesis'in window)){alert('Бұл браузерде дыбыстау қолжетімсіз. Сөзді мұғалім дауыстап оқып береді.');return;}try{window.speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(word);msg.lang='kk-KZ';msg.rate=.75;msg.pitch=1;const voices=window.speechSynthesis.getVoices();const kk=voices.find(v=>/^kk([_-]|$)/i.test(v.lang));if(kk)msg.voice=kk;window.speechSynthesis.speak(msg);}catch(e){alert('Дыбыстау қолжетімсіз. Сөзді мұғалім оқып береді.')}}
function tone(good){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(good?540:310,ctx.currentTime);if(good)o.frequency.linearRampToValueAtTime(760,ctx.currentTime+.1);g.gain.setValueAtTime(.045,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.2);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.21);setTimeout(()=>ctx.close(),400);}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='home'||action==='modules'||action==='progress'||action==='teacher')setPage(action);else if(action==='start')startGame(b.dataset.module);else if(action==='answer')answer(b.dataset.value);else if(action==='tile')stageClick(b.dataset.idx);else if(action==='remove')stageRemove(b.dataset.pos);else if(action==='check')stageCheck();else if(action==='clear'){ui.stage=[];ui.feedback=null;render()}else if(action==='next')next();else if(action==='speak'){const q=getCurrent();speak(ui.module==='sentence'?q.word:soundText(q))}else if(action==='reveal'){ui.reveal=!ui.reveal;render()}else if(action==='export')exportCSV();else if(action==='clear-data'){if(confirm('Барлық 25 оқушының сақталған ойын және диагностика деректерін тазартасыз ба? Бұл әрекетті қайтару мүмкін емес.')){data=defaultData();saveData();render();}}});
$('#profile').addEventListener('change',e=>{if(!data.profiles[e.target.value])return;data.current=e.target.value;saveData();if(ui.page==='game'||ui.page==='finish')ui.page='home';render();});
app.addEventListener('change',e=>{const x=e.target;if(x.matches('[data-diagnostic]')){const id=x.dataset.code,part=x.dataset.diagnostic,v=x.value;if(!data.profiles[id]||!['before','after'].includes(part))return;data.profiles[id].diagnostic[part]=v;saveData();render();}});
render();
</script>
